<!doctype html>
<html lang="en" data-shell="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>简历排版助手</title>
    <!--
      页签图标：古金刊头 + 三行正文的白纸，方角、无渐变，和界面同一套语言。
      图形只定义一次，在 app/make_favicon.py 里；改完跑 python3 app/make_favicon.py，
      它会把下面的 SVG 源码与两个 href（SVG 矢量 + 32×32 PNG）一起重写。
      Safari 26 之前不认 SVG 图标，所以 PNG 那份是必需的兜底，不是冗余。
      <svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='#1c2644'/><rect x='8' y='4' width='16' height='24' fill='#fbfaf7'/><rect x='8' y='4' width='16' height='4' fill='#c8a870'/><rect x='11' y='12' width='10' height='2' fill='#232c42'/><rect x='11' y='17' width='10' height='2' fill='#7d8598'/><rect x='11' y='22' width='7' height='2' fill='#7d8598'/></svg>
    -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20fill='%231c2644'/%3E%3Crect%20x='8'%20y='4'%20width='16'%20height='24'%20fill='%23fbfaf7'/%3E%3Crect%20x='8'%20y='4'%20width='16'%20height='4'%20fill='%23c8a870'/%3E%3Crect%20x='11'%20y='12'%20width='10'%20height='2'%20fill='%23232c42'/%3E%3Crect%20x='11'%20y='17'%20width='10'%20height='2'%20fill='%237d8598'/%3E%3Crect%20x='11'%20y='22'%20width='7'%20height='2'%20fill='%237d8598'/%3E%3C/svg%3E"
    />
    <link rel="icon" type="image/png" sizes="32x32" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAAVElEQVR42mOQUXP5P5CYYdQBg94BJ1YUUIRHHTD0HfD713eK8KgDhpcDlHWciMLD1wGjaWDAHVDbOoMoPHwdMJoGBnUiHBkOGE0DI9MBoz2jYe8AAO+rDojvT5+7AAAAAElFTkSuQmCC" />
    <script>
      // 首帧就套上用户上次选的外壳，避免先闪一下默认色
      try {
        var s = localStorage.getItem('resume-assistant-shell')
        if (s === 'light' || s === 'dark') document.documentElement.dataset.shell = s
      } catch (e) {
        /* 沙箱里读不到 localStorage：用默认的深色 */
      }
    </script>
